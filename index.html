<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArenaCash — Indique um amigo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --roxo-noite: #1B0B3F;
    --roxo-eletrico: #7C3AED;
    --verde-menta: #6EE7B7;
    --verde-esmeralda: #10B981;
    --lilas-claro: #D9CCFF;
    --branco: #FFFFFF;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    height:100%;
    background: #E7E1F5;
    font-family: 'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .stage{
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: clamp(16px, 4vw, 32px);
  }

  .slide{
    position:relative;
    width:1280px;
    max-width:100%;
    aspect-ratio: 16 / 9;
    background: var(--roxo-noite);
    border: clamp(8px, 1.4vw, 14px) solid var(--branco);
    border-radius: 20px;
    overflow:hidden;
    box-shadow: 0 40px 80px -20px rgba(27,11,63,0.5), 0 0 0 1px rgba(27,11,63,0.06);
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding: 6% 7%;
  }

  /* Camada de fundo: diagonal e textura sutil */
  .slide::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 8% 92%, rgba(16,185,129,0.35), transparent 45%),
      linear-gradient(135deg, var(--roxo-noite) 40%, var(--roxo-eletrico) 145%);
    z-index:0;
  }

  .slide::after{
    content:"";
    position:absolute;
    inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 26px 26px;
    z-index:0;
  }

  .eyebrow{
    position:relative; z-index:2;
    display:inline-flex;
    align-items:center;
    gap:10px;
    width:fit-content;
    padding: 8px 18px 8px 14px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px;
    color: var(--branco);
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 14px;
    letter-spacing: 0.04em;
    margin-bottom: 34px;
    backdrop-filter: blur(4px);
  }

  .eyebrow .dot{
    width:8px; height:8px; border-radius:50%;
    background: #6EE7B7;
    box-shadow: 0 0 0 4px rgba(110,231,183,0.18);
  }

  .content{
    position:relative;
    z-index:2;
    max-width: 66%;
  }

  h1{
    font-family:'Sora', sans-serif;
    font-weight: 800;
    color: var(--branco);
    font-size: clamp(32px, 5.5vw, 64px);
    line-height: 1.08;
    letter-spacing: -0.01em;
  }

  h1 .valor{
    color: var(--lilas-claro);
    -webkit-text-stroke: 1px rgba(255,255,255,0.35);
  }

  .subtitulo{
    margin-top: 24px;
    font-family:'Inter', sans-serif;
    font-weight: 400;
    font-size: clamp(15px, 1.6vw, 19px);
    line-height: 1.55;
    color: rgba(230,224,250,0.85);
    max-width: 480px;
  }

  .cta{
    margin-top: 44px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    background: var(--branco);
    color: var(--roxo-noite);
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size: 17px;
    padding: 16px 30px;
    border: none;
    border-radius: 999px;
    cursor:pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 12px 30px -10px rgba(0,0,0,0.35);
  }

  .cta:hover{
    transform: translateY(-2px);
    box-shadow: 0 16px 36px -8px rgba(0,0,0,0.45);
  }

  .cta:focus-visible{
    outline: 3px solid var(--verde-menta);
    outline-offset: 3px;
  }

  .cta svg{ width:16px; height:16px; }

  /* Assinatura visual: duas "moedas" sobrepostas, uma para quem indica e uma para quem chega */
  .moedas{
    position:absolute;
    z-index:1;
    right: 6%;
    top: 50%;
    transform: translateY(-50%);
    width: 300px;
    height: 300px;
  }

  .moeda{
    position:absolute;
    width: 190px;
    height: 190px;
    border-radius:50%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:'Sora', sans-serif;
    color:var(--branco);
    border: 1px solid rgba(255,255,255,0.25);
  }

  .moeda.a{
    top: 10px;
    left: 0;
    background: linear-gradient(160deg, #A78BFA, #6D28D9);
    box-shadow: 0 25px 50px -15px rgba(0,0,0,0.5);
  }

  .moeda.b{
    bottom: 0;
    right: 0;
    background: linear-gradient(160deg, #6EE7B7, #059669);
    box-shadow: 0 25px 50px -15px rgba(0,0,0,0.5);
  }

  .moeda .cifrao{
    font-size: 40px;
    font-weight: 800;
    line-height:1;
  }

  .moeda .legenda{
    margin-top: 6px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.75;
  }

  .marca{
    position:absolute;
    z-index:2;
    top: 6%;
    left: 7%;
    display:flex;
    align-items:center;
    gap:10px;
  }

  .marca .icone{
    width: 30px; height:30px;
    border-radius: 9px;
    background: var(--branco);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Sora', sans-serif;
    font-weight:800;
    color: var(--roxo-eletrico);
    font-size: 15px;
  }

  .marca span{
    font-family:'Sora', sans-serif;
    font-weight:700;
    color: var(--branco);
    font-size: 16px;
    letter-spacing: 0.01em;
  }

  /* Telas médias (tablets): reduz a área das moedas sem escondê-las de vez */
  @media (max-width: 960px){
    .content{ max-width: 78%; }
    .moedas{
      width: 220px;
      height: 220px;
    }
    .moeda{ width: 140px; height: 140px; }
    .moeda .cifrao{ font-size: 30px; }
  }

  /* Telas pequenas (celulares): empilha o conteúdo, mas mantém a moldura */
  @media (max-width: 720px){
    .slide{ aspect-ratio: auto; min-height: auto; padding: 12% 8%; border-radius: 16px; }
    .content{ max-width: 100%; }
    .subtitulo{ max-width: 100%; }
    .moedas{ display:none; }
  }

  /* Telas muito pequenas: ajusta espaçamentos e o botão */
  @media (max-width: 380px){
    .eyebrow{ font-size: 12px; padding: 6px 14px 6px 12px; margin-bottom: 24px; }
    .cta{ width:100%; justify-content:center; font-size: 15px; padding: 14px 24px; }
  }

  @media (prefers-reduced-motion: reduce){
    .cta{ transition:none; }
  }
</style>
</head>
<body>

  <div class="stage">
    <section class="slide">

      <div class="marca">
        <div class="icone">A</div>
        <span>ArenaCash</span>
      </div>

      <div class="eyebrow">
        <span class="dot"></span>
        Campanha de indicação
      </div>

      <div class="content">
        <h1>Indique um amigo<br>e ganhe <span class="valor">R$ 150</span></h1>
        <p class="subtitulo">
          Compartilhe seu código, seu amigo abre a conta e os dois saem ganhando.
          Sem burocracia, o dinheiro cai direto no seu saldo ArenaCash.
        </p>
        <button class="cta" type="button">
          Saiba mais
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="moedas">
        <div class="moeda a">
          <div class="cifrao">R$50</div>
          <div class="legenda">Você</div>
        </div>
        <div class="moeda b">
          <div class="cifrao">R$50</div>
          <div class="legenda">Seu amigo</div>
        </div>
      </div>

    </section>
  </div>

</body>
</html>
